name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release

permissions:
  contents: read

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Environment
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

          umask 077
          RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/my-upload-key.jks"

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            test -n "${RELEASE_STORE_PASSWORD:-}" || {
              echo "RELEASE_STORE_PASSWORD is required when RELEASE_KEYSTORE_BASE64 is set"
              exit 1
            }
            test -n "${RELEASE_KEY_ALIAS:-}" || {
              echo "RELEASE_KEY_ALIAS is required when RELEASE_KEYSTORE_BASE64 is set"
              exit 1
            }
            test -n "${RELEASE_KEY_PASSWORD:-}" || {
              echo "RELEASE_KEY_PASSWORD is required when RELEASE_KEYSTORE_BASE64 is set"
              exit 1
            }
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
            test -s "$RELEASE_KEYSTORE_PATH"
            echo "Using the configured release keystore from GitHub Secrets."
          else
            echo "RELEASE_KEYSTORE_BASE64 is not configured; generating a temporary test release key."
            RELEASE_STORE_PASSWORD="$(openssl rand -hex 32)"
            RELEASE_KEY_PASSWORD="$RELEASE_STORE_PASSWORD"
            RELEASE_KEY_ALIAS="upload"
            keytool -genkeypair -v \
              -keystore "$RELEASE_KEYSTORE_PATH" \
              -storepass "$RELEASE_STORE_PASSWORD" \
              -keypass "$RELEASE_KEY_PASSWORD" \
              -alias "$RELEASE_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=Release Test,OU=Mobile,O=Wudian,C=CN"
            echo "### 注意：本次使用的是临时测试签名密钥，不适用于应用商店正式发布或后续升级。" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，本次 Release 包使用临时测试签名，不能用于正式发布或升级。请配置 RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD 四个 Secrets。"
          fi

          test -s "$RELEASE_KEYSTORE_PATH"
          chmod 600 "$RELEASE_KEYSTORE_PATH"
          {
            echo "RELEASE_STORE_FILE=$RELEASE_KEYSTORE_PATH"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Verify Release APK Signature
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK_PATH" || { echo "No release APK found"; exit 1; }

          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER" || { echo "Android apksigner was not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Summarize Release APK
        id: verify_apk
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK_PATH" || { echo "Release APK does not exist"; exit 1; }

          APK_NAME=$(basename "$APK_PATH")
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_SHA=$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

          {
            echo "### Android Release APK 构建成功"
            echo ""
            echo "| 属性 | 详细信息 |"
            echo "|---|---|"
            echo "| 文件 | $APK_NAME |"
            echo "| 大小 | $APK_SIZE |"
            echo "| SHA-256 | $APK_SHA |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          retention-days: 30

      - name: Remove Temporary Release Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/my-upload-key.jks"
